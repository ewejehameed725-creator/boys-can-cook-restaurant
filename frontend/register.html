<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account | Boys Can Cook</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><div class="auth-box"><a class="brand center" href="index.html"><div class="brand-mark">BCC</div><div><strong>BOYS CAN COOK</strong><small>Restaurant</small></div></a><span class="eyebrow">JOIN BCC</span><h1>Create your account</h1><p class="muted">One account for food, wallet and orders.</p><form id="registerForm"><label>Full name<input required name="name" placeholder="Your full name"></label><label>Phone number<input required name="phone" placeholder="080..."></label><label>Email<input type="email" name="email" placeholder="you@example.com"></label><label>Password<input required type="password" name="password" minlength="6" placeholder="At least 6 characters"></label><button class="primary-btn full" type="submit">Create account</button></form><div id="authMessage" class="message"></div><p class="switch">Already have an account? <a href="login.html">Login</a></p></div><script src="js/app.js"></script></body></html>
