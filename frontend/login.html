<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login | Boys Can Cook</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<div class="mobile-overlay" id="mobileOverlay"></div>

<aside class="mobile-menu" id="mobileMenu">
    <button class="mobile-close" id="mobileClose">&times;</button>

    <div class="mobile-menu-logo">
        <div class="brand-mark">BCC</div>
        <strong>BOYS CAN COOK</strong>
        <small>Restaurant</small>
    </div>

    <nav>
        <a href="index.html">🏠 Home</a>
        <a href="menu.html">🍽️ Menu</a>
        <a href="orders.html">📦 Orders</a>
        <a href="wallet.html">💰 Wallet</a>
        <a href="account.html">👤 Account</a>
        <a href="cart.html">🛒 Cart</a>
        <a href="login.html">🔐 Login</a>
    </nav>
</aside>

<body class="auth-page">
    <div class="auth-box">
        <a class="brand center" href="index.html">
            <div class="brand-mark">BCC</div>
            <div>
                <strong>BOYS CAN COOK</strong>
                <small>Restaurant</small>
            </div>
        </a>
        <span class="eyebrow">WELCOME BACK</span>
        <h1>Login to your account</h1>
        <p class="muted">Manage your orders, wallet and delivery details.</p>
        <form id="loginForm">
            <label>Email or phone<input required name="identifier" placeholder="Email or phone number">
            </label>
            <label>Password<input required type="password" name="password" placeholder="Your password">
            </label>
            <button class="primary-btn full" type="submit">Login</button>
        </form>
        <div id="authMessage" class="message">
        </div>
        <p class="switch">Don't have an account? <a href="register.html">Create one</a>
        </p>
    </div>
    <script src="js/app.js">
    </script>
</body>

</html>
