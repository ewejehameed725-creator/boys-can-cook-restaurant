<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>My Account | Boys Can Cook</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="topbar">
        <a class="brand" href="index.html">
            <div class="brand-mark">BCC</div>
            <div>
                <strong>BOYS CAN COOK</strong>
                <small>Restaurant</small>
            </div>
        </a>
        <nav class="desktop-nav">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="orders.html">Orders</a>
            <a href="wallet.html">Wallet</a>
            <a class="active" href="account.html">Account</a>
        </nav>
        <div class="header-actions">
            <a class="cart-btn" href="cart.html">🛒 <span id="cartCount">0</span>
            </a>
        </div>
        <button class="menu-toggle" id="menuToggle">☰</button>
    </header>
    <main class="page">
        <div class="page-title">
            <span class="eyebrow">MY ACCOUNT</span>
            <h1>Hello, <span id="accountName">Customer</span> 👋</h1>
            <p>Everything you need for your Boys Can Cook orders.</p>
        </div>
        <div class="dashboard-grid">
            <a class="dash-card wallet-card" href="wallet.html">
                <span>💰</span>
                <small>Wallet balance</small>
                <strong id="walletBalance">₦0.00</strong>
                <em>Add money →</em>
            </a>
            <a class="dash-card" href="orders.html">
                <span>📦</span>
                <small>Orders</small>
                <strong id="orderCount">0</strong>
                <em>View orders →</em>
            </a>
            <div class="dash-card">
                <span>📍</span>
                <small>Delivery address</small>
                <strong id="addressText">Not added</strong>
                <em>Add address →</em>
            </div>
        </div>
        <div class="profile-card">
            <div>
                <span class="eyebrow">PROFILE</span>
                <h2>Your details</h2>
            </div>
            <div class="profile-fields">
                <p>
                    <small>Name</small>
                    <strong id="profileName">—</strong>
                </p>
                <p>
                    <small>Phone</small>
                    <strong id="profilePhone">—</strong>
                </p>
                <p>
                    <small>Email</small>
                    <strong id="profileEmail">—</strong>
                </p>
            </div>
            <button class="secondary-btn" id="logoutBtn">Log out</button>
        </div>
    </main>
    <script src="js/app.js">
    </script>
</body>

</html>
